# ivrbridge 헬스체크: GET /ivrbridge/health -> {"status":"UP","application":"ecs-ivrbridge"}
connector: ecs/ivrbridge-health
kind: rest-json
description: ivrbridge 상태 확인 (status 가 UP 이면 정상)
host: ${hosts.ivrbridge}
timeout_ms: 2000
rest:
  method: GET
  path: /ivrbridge/health
  headers: { accept: "*/*" }
  response_map:
    status: status
    application: application
ok_when: resp.status == 'UP'
