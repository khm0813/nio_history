id: common_ems
version: 0.1.0
name: 공통 엔진 장애 시나리오
start: welcome
defaults:
  timeout_sec: 5
  max_retry: 3
  on_max_retry: bye
  on_error: bye
nodes:
  welcome:
    type: play
    label: 인사
    prompts:
      - id: ""
        tts: "죄송합니다. 현재 서비스 점검중이기 때문에, 상담원 연결을 할 수 없습니다. 다시 연결 부탁드립니다. "
    next: bye
  bye:
    type: hangup
    label: 종료
    prompts:
      - tts: 감사합니다.
sections:
  main:
    title: 공통 엔진 장애 시나리오
    nodes: [ welcome, bye ]
layout:
  sections:
    main:
      x: -190
      y: -58
      w: 800
      h: 517
  nodes:
    welcome:
      x: -260
      y: 80
    bye:
      x: 300
      y: 0
