id: kiwoom-ars-9900
version: 0.1.1
name: 키움증권 9900 시나리오
defaults:
  timeout_sec: 5
  max_retry: 3
  on_max_retry: bye
  on_error: bye
nodes:
  welcome:
    type: play
    label: 인사
    prompts:
      - tts: 안녕하세요. 키움증권입니다만, 이것은 BP교환기로 받은 콜입니다.
        id: M00000
    next: menu
  bye:
    type: hangup
    label: 종료
    prompts:
      - tts: 감사합니다.
        id: bye
  menu:
    type: menu
    label: menu
    prompts:
      - id: M00001
        tts: 빠른주문은 1번, 일반주문은 2번 , 현재가,호가안내는 3번,  상담원연결은 0번을 눌러주세요.
    choices:
      "0": service_code-0n49o9
      "1": service_code-0n49o9
      "2": bye
    noinput_prompts:
      - id: noinput
        tts: 입력이 없습니다. 다시 시도해주세요.
    nomatch_prompts:
      - id: nomatch
        tts: 잘못 누르셨습니다. 다시 시도해주세요.
  play:
    type: play
    label: 시세및시황 진입 멘트
    prompts:
      - tts: 시세 및 시황 서비스입니다.
        id: M00002
    next: set
  menu_2:
    type: menu
    label: "시세및시황 메뉴"
    prompts:
      - tts: 현재가 및 호가 안내는 1번, 관심 종목 또는 보유 종목 현재가 조회 및  주문은 2번, 지수 정보 안내는 3번, 직원 연결은 0번, 이전 서비스 우물 정자, 다시 듣기는 별표를 눌러 주십시오
        id: V130001
    choices:
      "1": play_2
      "2": menu
      "3": menu
      "*": menu_2
    nomatch_prompts:
      - id: nomatch
        tts: 잘못 누르셨습니다. 다시 시도해주세요.
    noinput_prompts:
      - id: noinput
        tts: 입력이 없습니다. 다시 시도해주세요.
  play_2:
    type: play
    label: "현재가 및 호가 안내 진입멘트"
    prompts:
      - tts: 현재가 및 호가 안내 서비스입니다.
        id: V1030002
    service_code: N20000002
    next: notice
  notice:
    type: play
    label: KRX 시세 안내
    prompts:
      - id: V1010045
        tts: ARS에서는 KRX시세 조회만 가능하며, NXT시세 조회를 원하실 경우, 직원 연결 또는 PC 영웅문, 스마트폰 영웅문 S#을 이용 부탁드립니다.
    next: call_backend
  ask_code:
    type: collect
    label: 종목코드 입력
    prompts:
      - id: C1000034
        tts: 매수하시려는 종목코드 6자리를 눌러주십시오.
    var: item_code
    min_digits: 6
    max_digits: 6
    noinput_prompts:
      - id: noinput
    nomatch_prompts:
      - id: nomatch
    next: lookup_quote
    term_key: "#"
  lookup_quote:
    type: script
    label: S3100 시세 조회 (모의)
    lang: java
    timeout_ms: 200
    note: 전문 S3100 대신 모의 시세를 고릅니다. 실제 연동 때 전문 호출(call_backend)로 바꿉니다.
    code: |
      String code = vars.get("item_code");
      if (code == null || code.length() != 6) return "invalid";
      // mock host: codes starting with 9 do not exist
      if (code.startsWith("9")) return "not_found";
      // mock S3100 replies: price|diff|ask1|bid1|volume ; one per quote_N audio
      String table = "73,400|-1,600|73,500|73,400|362,321;80,900|+2,000|81,000|80,900|1,253,854;141,800|-600|141,900|141,800|2,776,213;144,800|+900|144,900|144,800|1,550,331;118,900|-3,200|119,000|118,900|71,442";
      String[] quotes = table.split(";");
      int k = new Random().nextInt(quotes.length);
      String[] q = quotes[k].split("\\|");
      vars.put("quote", String.valueOf(k + 1));
      vars.put("price", q[0]);
      vars.put("diff", q[1]);
      vars.put("diff_abs", q[1].substring(1));
      vars.put("updown", q[1].startsWith("-") ? "하락" : "상승");
      vars.put("ask1", q[2]);
      vars.put("bid1", q[3]);
      vars.put("volume", q[4]);
      log("S3100 mock " + code + " -> quote_" + (k + 1));
      StringBuffer sb = new StringBuffer();
      sb.append("ok");
      String resu = sb.toString();

      return resu.equals("ok") ? "ok" :"fail";
    exits:
      ok: say_quote
      not_found: code_err
      invalid: code_err
      fail: code_err
    on_error: code_err
  code_err:
    type: play
    label: 종목코드 오류
    prompts:
      - id: S3100_err
        tts: 입력하신 종목코드를 찾을 수 없습니다. 다시 입력해 주십시오.
    next: ask_code
  say_quote:
    type: play
    label: 현재가 안내
    prompts:
      - id: quote_${vars.quote}
        tts: 현재가는 ${vars.price}원, 전일 대비 ${vars.diff_abs}원 ${vars.updown}, 매도 1호가 ${vars.ask1}원, 매수 1호가 ${vars.bid1}원, 거래량은 ${vars.volume}주입니다.
    next: end_menu
  end_menu:
    type: menu
    label: 현재가 끝 메뉴
    prompts:
      - id: V1030003
        tts: ARS주문은 1번, 호가 잔량 안내는 2번, 5단 호가 및 잔량은 3번, 상한가 및 당일 시가, 고가, 저가는 4번, 이전 서비스는 우물 정자, 다시 듣기는 별표를 눌러주십시오.
    choices:
      "1": not_ready
      "2": not_ready
      "3": not_ready
      "4": not_ready
      "#": menu_2
      "*": say_quote
    noinput_prompts:
      - id: noinput
    nomatch_prompts:
      - id: nomatch
  not_ready:
    type: play
    label: 준비 중 안내
    prompts:
      - id: not_ready
        tts: 준비 중인 서비스입니다.
    next: end_menu
  call_backend:
    type: call_backend
    label: call_backend
    connector: "ecs/ivrbridge-health"
    in: {}
    out:
      status: status
    next: play_4
  set:
    type: set
    vars:
      name: kim
    next: branch
    label: 이름설정
  branch:
    type: branch
    label: branch
    cases:
      - when: vars.name == "kim"
        next: menu_2
    default: call_subflow_2
  call_subflow_2:
    type: call_subflow
    scenario: "transfer_agent_common"
    exits:
      error: play_3
      ok: hangup
      play: hangup
    label: "시세및 시황 서비스-상담원연결"
    in:
      agent_num: ${site.transfer.agent_number}
    out: {}
  hangup:
    type: hangup
    label: hangup
    reason: normal
  play_3:
    type: play
    label: play_3
    prompts:
      - tts: 상담원을 연결할 수 없습니다. 다시 걸어주세요.
        id: err_transfer
    next: hangup
  play_4:
    type: play
    label: play_4
    prompts:
      - tts: 매수하시려는 종목코드 6자리를 눌러주십시오.
        id: C1000034
    next: ask_code
  service_code-glv0ls:
    type: service_code
    label: 인사 통계
    service_code: U00000000
    next: welcome
  service_code-0n49o9:
    type: service_code
    label: 시세및시황 진입 멘트 통계
    service_code: U00000000
    next: play
sections:
  main:
    title: 키움증권 9900 시나리오
    nodes:
      - welcome
      - bye
      - menu
      - service_code-glv0ls
  sec:
    nodes:
      - play
      - menu_2
      - set
      - branch
      - call_subflow_2
      - hangup
      - play_3
      - service_code-0n49o9
    title: "03 : 시세및 시황 서비스"
  sec_2:
    title: "03 > 01 : 현재가 및 호가 안내"
    nodes:
      - play_2
      - notice
      - ask_code
      - lookup_quote
      - code_err
      - say_quote
      - end_menu
      - not_ready
      - call_backend
      - play_4
