id: test_main
version: 0.1.0
name: 통합테스트시나리오
start: service_code-toc51k
defaults:
  timeout_sec: 5
  max_retry: 3
  on_max_retry: bye
  on_error: bye
nodes:
  welcome:
    type: play
    prompts:
      - tts: 안녕하세요. ECS 통합테스트 시나리오입니다. 이 테스트에서는 모든 케이스의 시나리오 테스트를 진행합니다.
    next: branch-q3c9rm
    label: 통합테스트시나리오-인사
  bye:
    type: hangup
    label: 종료
    prompts:
      - tts: 감사합니다.
  service_code-toc51k:
    type: service_code
    label: 통합테스트 메인시나리오 시작 통계
    service_code: "TEST0000"
    next: notice-x32arn
  branch-q3c9rm:
    type: branch
    label: 분기
    cases:
      - when: session.dnis == '68001'
        next: play-hg3b8v
      - when: session.dnis == '8003'
        next: play-7hx4gt
  play-hg3b8v:
    type: play
    label: 통합테스트시나리오_멘트 재생(CVP인입)
    prompts:
      - tts: |-
          ${session.vendor} 으로부터 연결되었습니다. 전달받은값은 Application  : ${session.cvp_application}, ani : ${session.cvp__ani}, callKey : ${session.cvp_callkey}
          으로 전달받았습니다.
    next: bye
  play-7hx4gt:
    type: play
    label: 통합테스트시나리오_멘트 재생(BP인입)
    prompts:
      - tts: "${session.vendor} 으로부터 연결되었습니다. "
  notice-x32arn:
    type: notice
    label: 공지사항
    next: welcome
    notices:
      - n-20261110-1
    exits:
      end: welcome
sections:
  main:
    title: 통합테스트시나리오-메인분기
    nodes:
      - welcome
      - bye
      - service_code-toc51k
      - branch-q3c9rm
      - play-hg3b8v
      - play-7hx4gt
      - notice-x32arn
layout:
  sections:
    main:
      x: -790
      y: -218
      w: 1640
      h: 835
  nodes:
    welcome:
      x: -160
      y: -160
    bye:
      x: 740
      y: -220
    service_code-toc51k:
      x: -760
      y: -140
    branch-q3c9rm:
      x: 140
      y: -180
    play-hg3b8v:
      x: 440
      y: -220
    play-7hx4gt:
      x: 440
      y: -100
    notice-x32arn:
      x: -460
      y: -160
