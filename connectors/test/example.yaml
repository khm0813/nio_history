connector: test/example
kind: rest-json
description: what this API does
host: test_host # name in hosts.yaml (url)
timeout_ms: 1500
retry: 0

rest:
  method: GET
  path: /avatar/info
  headers: { X-Channel: IVR }
  body_template: { custId: "${in.custId}", ani: "${in.ani}" }
  response_map:
    # out field <- dotted path in the JSON response
    grade: data.grade
    name: data.name

ok_when: resp.grade != ''
