id: test_callback
version: 0.1.0
name: 통합테스트-콜백
start: welcome
defaults:
  timeout_sec: 5
  max_retry: 3
  on_max_retry: bye
  on_error: bye
nodes:
  welcome:
    type: play
    label: 인사
    prompts:
      - tts: 안녕하세요.
    next: bye
  bye:
    type: hangup
    label: 종료
    prompts:
      - tts: 감사합니다.
sections:
  main:
    title: 통합테스트-콜백
    nodes: [welcome, bye]
