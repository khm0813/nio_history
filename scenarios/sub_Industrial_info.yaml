id: sub_Industrial_info
version: 0.1.0
name: 서브_산업안전보건법_멘트플레이
start: step
defaults:
  timeout_sec: 5
  max_retry: 3
  on_max_retry: done
  on_error: done
nodes:
  step:
    type: play
    label: 안내
    prompts:
      - tts: 산업안전 보건법에따라 상담원의 인권을 존중해주세요. 누군가의 자식입니다.
        id: industrial_info
        bargein: false
    next: done
  done:
    type: return
    label: 돌아가기
    exit: play
sections:
  main:
    title: 서브_산업안전보건법_멘트플레이
    nodes: [ step, done ]
layout:
  nodes:
    step:
      x: -240
      y: 0
    done:
      x: 320
      y: 20
