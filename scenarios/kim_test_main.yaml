id: common_before
version: 0.1.0
name: 공통 진입 (인사·점검)
start: mark
defaults:
  timeout_sec: 5
  max_retry: 1
  on_max_retry: go
  on_error: go
nodes:
  mark:
    type: set
    label: 진입 표시
    vars:
      entered_via: common_before
      entry_dnis: "${session.dnis}"
    next: call_backend-tgr0k1
  go:
    type: return
    label: 메인으로
    exit: ok
  call_backend-tgr0k1:
    type: call_backend
    label: "전문 호출_ERS_CALL"
    connector: "it/call"
    in: {}
    out: {}
    note: "ERS Call Start 전문"
    next: go
sections:
  main:
    title: common_before_메인
    nodes:
      - mark
      - go
      - call_backend-tgr0k1
layout:
  nodes:
    mark:
      x: 0
      y: 0
    go:
      x: 600
      y: 20
    call_backend-tgr0k1:
      x: 300
      y: 0
  sections:
    main:
      x: -210
      y: -78
      w: 820
      h: 592
