        next: set-b96z72
    default: play-7kpcrm
  play-lj2xgt:
    type: play
    label: 멘트 재생_휴무안내
    prompts:
      - tts: 죄송합니다. 금일은 ${vars.holydayNm} 으로, 한국 GM의 휴무일입니다.
    next: play-695xwp
  play-7kpcrm:
    type: play
    label: 멘트 재생_업무외안내
    prompts:
      - tts: 죄송합니다. 지금은 대표번호 운영시간이 아닙니다.
    next: play-695xwp
  play-695xwp:
    type: play
    label: 멘트 재생_운영시간안내
    prompts:
      - tts: 대표번호 운영시간은 평일 오전 9시부터 저녁 6시까지 입니다.
    next: collect-7sb7j0
  menu-4w8960:
    type: menu
    label: 메뉴_긴급용무메뉴
    prompts:
      - tts: 긴급한 용무가 있으신 분은 0번을 눌러주십시오.
    choices:
      "0": call_subflow-fx3od9
    noinput_prompts:
      - tts: 입력이 되지않았습니다. 다시 입력해주세요.
    nomatch_prompts:
      - tts: 잘못된 번호가 입력되었습니다. 확인 후 다시 입력해주시기 바랍니다.
    timeout_sec: 10
    max_retry: 3
    on_max_retry: play-l6j7xa
    on_error: play-l6j7xa
  set-b96z72:
    type: set
    label: 변수 설정
    vars:
      holydayNm: ${holidayName()}
    next: play-lj2xgt
  service_code-tg815r:
    type: service_code
    label: ARS 시험 A 통계
    service_code: "T00000000"
    next: welcome
  notice-fwgvje:
    type: notice
    label: 공지사항
    point: _ENTRY
    next: branch-jkwl74
    notices:
      - n-20261104-2
  call_subflow-fx3od9:
    type: call_subflow
    label: 서브플로우
    scenario: "transfer_agent_common"
    exits: { error: hangup-4tpzqr, ok: hangup-4tpzqr }
    next: hangup-4tpzqr
  hangup-4tpzqr:
    type: hangup
    label: 종료
    reason: normal
  play-l6j7xa:
    type: play
    label: 멘트 재생
    prompts:
      - tts: 죄송합니다. 사용방법을 확인하시고 다시 이용해주세요.
    next: hangup-cw5xwc
  hangup-cw5xwc:
    type: hangup
    label: 종료
    reason: normal
  collect-7sb7j0:
    type: collect
    label: 숫자 입력
    prompts:
      - tts: 아무숫자를 입력해주세요.
    var: input
    min_digits: 1
    max_digits: 10
    next: menu-4w8960
    on_max_retry: play-l6j7xa
    on_error: play-l6j7xa
