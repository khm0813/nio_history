id: common_after
version: 0.1.0
name: 공통 종료 처리 (기록)
start: summarize
defaults:
  timeout_sec: 5
  max_retry: 1
  on_max_retry: done
  on_error: done
nodes:
  summarize:
    type: set
    label: 통화 요약
    vars:
      call_log: "${vars.scenario}|${vars.end_reason}|${vars.end_node}|${session.ani}"
    next: probe
  probe:
    type: call_backend
    label: ivrbridge 상태 (기록용)
    connector: ecs/ivrbridge-health
    out:
      bridge_at_end: status
    next: done
    on_timeout: done
    on_error: done
  done:
    type: hangup
    label: 끝
sections:
  main:
    title: common_after_메인
    nodes:
      - summarize
      - probe
      - done
