id: test_callback
version: 0.1.1
name: 통합테스트-삼자통화
start: service_code-s92avi
defaults:
  timeout_sec: 5
  max_retry: 3
  on_max_retry: bye
  on_error: bye
nodes:
  welcome:
    type: play
    label: 인사
    prompts:
      - tts: 안녕하세요!!!!!!. 고객님의 소중한 개인정보를 입력해주세요.!!!!!!!!!
    next: collect-oukf03
  bye:
    type: hangup
    label: 종료
    prompts:
      - tts: 감사합니다.
  collect-oukf03:
    type: collect
    label: 숫자 입력
    prompts:
      - tts: 전화번호 입력 후 우물정자를 눌러주세요.
    var: input
    min_digits: 1
    max_digits: 13
    next: play-ydqcq5
    term_key: "#"
    max_retry: 3
    interdigit_timeout_sec: 13
  play-ydqcq5:
    type: play
    label: 멘트 재생
    prompts:
      - tts: 입력하신 번호는 ${vars.input} 입니다.
    next: menu-c1o80h
  menu-c1o80h:
    type: menu
    label: 메뉴
    prompts:
      - tts: 맞으면 1번, 틀리면 2번을 눌러주세요.
    choices:
      "1": bye
      "2": collect-oukf03
    max_retry: 3
  service_code-s92avi:
    type: service_code
    label: ARS 시험 A 통계
    service_code: "T00000000"
    next: welcome
sections:
  main:
    title: 통합테스트-삼자통화
    nodes:
      - welcome
      - bye
      - collect-oukf03
      - play-ydqcq5
      - menu-c1o80h
      - service_code-s92avi
layout:
  nodes:
    welcome:
      x: -60
      y: -380
    bye:
      x: 1140
      y: -380
    collect-oukf03:
      x: 240
      y: -400
    play-ydqcq5:
      x: 540
      y: -420
    menu-c1o80h:
      x: 840
      y: -400
    service_code-s92avi:
      x: -360
      y: -380
  sections:
    main:
      x: -250
      y: -58
      w: 1640
      h: 866
