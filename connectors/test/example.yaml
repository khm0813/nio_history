connector: test/example
kind: rest-json
description: what this API does
host: demo_api                 # name in hosts.yaml (url)
timeout_ms: 1500
retry: 0

rest:
  method: POST
  path: /v1/customer/${in.custId}
  headers: { X-Channel: IVR }
  body_template: { custId: "${in.custId}", ani: "${in.ani}" }
  response_map:                # out field <- dotted path in the JSON response
    grade: data.grade
    name: data.name

ok_when: resp.grade != ''
