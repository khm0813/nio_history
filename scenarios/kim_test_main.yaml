id: kim_test_main
version: 0.1.1
name: 김형민시나리오메인
defaults:
  timeout_sec: 5
  max_retry: 3
nodes:
  hangup-v9pj30:
    type: hangup
    label: 종료
    reason: "입력후 종료"
    prompts:
      - tts: "설정되었습니다. 입력해주셔서 감사합니다. "
  play-je3viz:
    type: play
    label: 멘트 재생
    prompts:
      - tts: "안녕하세요, 테스트입니다. "
    next: collect-h6f29s
  set-0wz7zr:
    type: set
    label: 변수 설정(초기셋팅)
    vars:
      agentNum: "1200"
      groupId: "1000"
    note: "초기 상담원아이디 셋팅"
    next: play-cob01n
  play-cob01n:
    type: play
    label: 멘트 재생
    prompts:
      - tts: 초기 셋팅된 상담원 번호는 ${vars.agentNum} 입니다. 그룹아이디는 ${vars.groupId} 입니다.
    next: menu-18jg04
  menu-18jg04:
    type: menu
    label: 메뉴
    prompts:
      - tts: 상담원번호를 바꾸실려면 1번, 그대로 유지할려면 2번을 눌러주세요.
        id: input_agent_num
    choices:
      "1": "collect-rgglgf"
      "2": "notice-ikj2v6"
  collect-rgglgf:
    type: collect
    label: 숫자 입력
    prompts:
      - tts: 상담원 번호를 입력해주세요.
    var: agentNum
    min_digits: 4
    max_digits: 5
    term_key: "#"
    next: menu-rgtlmr
  menu-rgtlmr:
    type: menu
    label: 메뉴
    prompts:
      - tts: 입력하신 번호는'${vars.agentNum} 입니다. 맞으면 1번, 틀리면 2번을 눌러주세요.
    choices:
      "1": "call_backend-n1cm7n"
      "2": "set-0wz7zr"
  hangup-wp5i8r:
    type: hangup
    label: 종료
    reason: 바로종료
  call_backend-n1cm7n:
    type: call_backend
    label: 전문 호출
    connector: "it/evt"
    in: {}
    out: {}
    next: hangup-v9pj30
    on_error: hangup-v9pj30
    on_timeout: hangup-v9pj30
  notice-ikj2v6:
    type: notice
    label: 공지사항
    next: hangup-wp5i8r
    notices:
      - n-20261104-2
      - it_n_a
  collect-h6f29s:
    type: collect
    label: 숫자 입력
    prompts:
      - tts: 아무 숫자를 입력해주세요.
    var: number
    min_digits: 1
    max_digits: 1
    next: call_backend-s33a9c
  call_backend-s33a9c:
    type: call_backend
    label: 전문 호출
    connector: "test/example"
    in:
      number: ${vars.number}
    out:
      userId: userId
      title: title
      id: id
      body: body
    next: play-mh27rx
    on_error: play-ja3zds
    on_timeout: play-ja3zds
  play-mh27rx:
    type: play
    label: 멘트 재생
    prompts:
      - tts: 전문을 읽어왔습니다. 아이디는 ${vars.id} 번 이며, 제목은 ${vars.title} 입니다.
    next: set-0wz7zr
  play-ja3zds:
    type: play
    label: 멘트 재생
    prompts:
      - tts: 전문호출에 실패했습니다. 다시 시도해주세요.
    next: collect-h6f29s
sections:
  main:
    title: 김형민시나리오메인
    nodes:
      - hangup-v9pj30
      - play-je3viz
      - set-0wz7zr
      - play-cob01n
      - menu-18jg04
      - collect-rgglgf
      - menu-rgtlmr
      - hangup-wp5i8r
      - call_backend-n1cm7n
      - notice-ikj2v6
      - collect-h6f29s
      - call_backend-s33a9c
      - play-mh27rx
      - play-ja3zds
layout:
  sections:
    main:
      x: -1090
      y: -198
      w: 1700
      h: 919
  nodes:
    hangup-v9pj30:
      x: 1380
      y: -420
    play-je3viz:
      x: -1020
      y: -260
    set-0wz7zr:
      x: -520
      y: -260
    play-cob01n:
      x: -220
      y: -300
    menu-18jg04:
      x: 80
      y: -320
    collect-rgglgf:
      x: 380
      y: -320
    menu-rgtlmr:
      x: 680
      y: -280
    hangup-wp5i8r:
      x: 620
      y: 100
    call_backend-n1cm7n:
      x: 960
      y: -420
    notice-ikj2v6:
      x: 280
      y: 40
    collect-h6f29s:
      x: -880
      y: -20
    call_backend-s33a9c:
      x: -560
      y: -20
    play-mh27rx:
      x: -260
      y: 0
    play-ja3zds:
      x: -500
      y: 180
start: play-je3viz
