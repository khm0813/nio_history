id: common_error
version: 0.1.0
name: 공통 오류 처리
start: sorry
defaults:
  timeout_sec: 5
  max_retry: 1
  on_max_retry: to_agent
  on_error: to_agent
nodes:
  sorry:
    type: play
    label: 오류 안내
    prompts:
      - tts: 처리 중 오류가 발생했습니다. 상담원에게 연결해 드리겠습니다.
        bargein: false
        id: sorry
    next: to_agent
  to_agent:
    type: transfer
    label: 상담원 연결
    mode: blind
    dest: ${site.transfer.agent_number}
    uui: "ERR|${session.ani}|${vars.last_error}"
sections:
  main:
    title: common_error_메인
    nodes:
      - sorry
      - to_agent
