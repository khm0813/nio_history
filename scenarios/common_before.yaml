id: common_before
version: 0.1.0
name: 공통 진입 (인사·점검)
start: mark
defaults:
  timeout_sec: 5
  max_retry: 1
  on_max_retry: go
  on_error: go
nodes:
  mark:
    type: set
    label: 진입 표시
    vars:
      entered_via: common_before
      entry_dnis: "${session.dnis}"
    next: call_backend-ynhrpv
  go:
    type: return
    label: 메인으로
    exit: ok
  call_backend-ynhrpv:
    type: call_backend
    label: 전문 호출
    connector: "it/call"
    in: {}
    out: {}
    next: go
    on_timeout: go
    on_error: go
sections:
  main:
    title: common_before_메인
    nodes:
      - mark
      - go
      - call_backend-ynhrpv
layout:
  sections:
    main:
      x: -30
      y: -58
      w: 640
      h: 669
  nodes:
    mark:
      x: -320
      y: 0
    go:
      x: 300
      y: 0
    call_backend-ynhrpv:
      x: -20
      y: 120
