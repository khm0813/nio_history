id: test_main
version: 0.1.0
name: 통합테스트시나리오
start: service_code-toc51k
defaults:
  timeout_sec: 5
  max_retry: 3
  on_max_retry: bye
  on_error: bye
nodes:
  welcome:
    type: play
    prompts:
      - tts: 안녕하세요. ECS 통합테스트 시나리오입니다. 이 테스트에서는 모든 케이스의 시나리오 테스트를 진행합니다.
    next: bye
    label: 통합테스트시나리오-인사
  bye:
    type: hangup
    label: 종료
    prompts:
      - tts: 감사합니다.
  service_code-toc51k:
    type: service_code
    label: 통합테스트 메인시나리오 시작 통계
    service_code: "TEST0000"
    next: welcome
sections:
  main:
    title: 통합테스트시나리오-메인분기
    nodes:
      - welcome
      - bye
      - service_code-toc51k
layout:
  sections:
    main:
      x: -30
      y: -58
      w: 640
      h: 609
  nodes:
    welcome:
      x: -180
      y: 100
    bye:
      x: 260
      y: 120
    service_code-toc51k:
      x: -600
      y: 100
