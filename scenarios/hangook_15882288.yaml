  max_retry: 3
nodes:
  welcome:
    type: play
    label: 인사
    prompts:
      - tts: 안녕하십니까. 한국GM 입니다.
    next: notice-fwgvje
  branch-jkwl74:
    type: branch
    label: 분기
    cases:
      - when: isOpen('center')
        next: play-yfz753
    default: branch-fxp2az
  play-yfz753:
    type: play
    label: "멘트 재생_잠시만멘트"
    prompts:
      - tts: 잠시만 기다려 주십시오.
    next: hangup-2at4ok
  hangup-2at4ok:
    type: hangup
    label: 종료
    reason: normal
  branch-fxp2az:
    type: branch
    label: 분기
    cases:
